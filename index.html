<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>心電図トレーニング</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: clinical, calm, fast to use on a phone between calls
   IDEA: a 3-lead monitor printout — pink grid paper strip
   PICTURE: the body chart for electrodes, then the printed strip
   COLOUR and TYPE: navy + ECG-paper pink + electrode red/yellow/green; Noto Sans JP
   LAYOUT: one column of steps: case → electrodes → strip → answer */
:root{color-scheme:light dark;--bg:light-dark(#f3f5f9,#0d1424);--card:light-dark(#fff,#162038);--ink:light-dark(#14233b,#e8edf5);--mut:light-dark(#5b687c,#9eabc0);--line:light-dark(#d8dee8,#2b3756);--acc:light-dark(#1d3a64,#9dbcff);--navy:#1d3a64;--ok:#1f9d4a;--ng:#d62b2b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans JP","Hiragino Sans",sans-serif;overflow-x:clip}
header{background:var(--navy);color:#fff;padding:12px max(4vw,16px);display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:20px;line-height:1.2;font-weight:900;flex:1}
header .btn{border-color:#fff;color:#fff;min-height:38px;padding:4px 12px;font-size:14px}
main{max-width:760px;margin:0 auto;padding:14px max(3vw,12px) 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 8px;line-height:1.35}
.mut{color:var(--mut);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 16px;border-radius:10px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font:inherit;font-weight:700;cursor:pointer;text-align:center}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn:focus-visible,.ch:focus-visible,.pk:focus-visible{outline:3px solid #8fb4ff;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px}.row>.btn{flex:1 1 140px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 12px}.prog i{display:block;height:100%;background:var(--acc)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:1px 10px;border-radius:20px;background:var(--navy);color:#fff;margin-bottom:6px}
.sc{font-size:17px;font-weight:700}
.pks{display:flex;gap:8px;margin-bottom:6px}
.pk{flex:1;min-height:44px;border-radius:10px;border:3px solid transparent;font:inherit;font-weight:900;color:#fff;cursor:pointer;opacity:.55}
.pk.on{opacity:1;border-color:var(--ink)}
.pk[data-c=r]{background:#d62b2b}.pk[data-c=y]{background:#e8b600;color:#222}.pk[data-c=g]{background:#1f9d4a}
.body{max-width:420px;margin:0 auto}.body svg{width:100%;height:auto;display:block;touch-action:manipulation}
.hit{cursor:pointer}
.pl{font-size:14px;margin:6px 0 10px;display:grid;gap:2px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.fb{border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.fb.ok{background:light-dark(#e4f5ea,#143424);border:1.5px solid var(--ok)}
.fb.ng{background:light-dark(#fde6e6,#3a1820);border:1.5px solid var(--ng)}
.fb b.big{font-size:18px}
.paper{background:#fff5f6;border:1px solid #efc1c9;border-radius:8px;overflow:hidden}
.paper canvas{display:block;width:100%}
.ch{display:block;width:100%;text-align:left;min-height:48px;margin-top:8px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.ch.ok{border-color:var(--ok);background:light-dark(#e4f5ea,#143424)}
.ch.ng{border-color:var(--ng);background:light-dark(#fde6e6,#3a1820)}
ul.pts{margin:6px 0 0;padding-left:1.2em}ul.pts li{margin:2px 0}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lib .btn{font-size:14px;min-height:48px;padding:6px 8px}
.cat{font-weight:700;font-size:14px;margin:12px 0 6px;color:var(--mut)}
.sw{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700}
.sw input{width:22px;height:22px}
.big{font-size:40px;font-weight:900;line-height:1.1}
.sm{font-size:13px;color:var(--mut);margin-top:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{min-height:40px;min-width:48px;padding:4px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.paper{position:relative}
.hrbox{display:flex;align-items:baseline;gap:6px;background:#0b1220;color:#4ef07a;border-radius:8px;padding:4px 12px;margin-bottom:8px;font-weight:900;width:max-content}
.hrbox b{font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}.hrbox span{font-size:13px;color:#9fe9b5}
.cur{position:absolute;width:2px;background:rgba(29,98,220,.75);pointer-events:none;display:none}
.heart{max-width:380px;margin:0 auto}.heart.nocd .cd,.heart.nolb .lb{display:none}.heart svg{width:100%;height:auto;display:block}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mut);margin-top:4px}
.hwrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.lsel{display:grid;grid-template-columns:repeat(2,46px);gap:5px}.lsel .t{grid-column:span 2;font-size:11px;color:var(--mut);text-align:center;font-weight:700}
.lsel button{min-height:38px;padding:0;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.lsel button.on{background:#1d5fd0;border-color:#1d5fd0;color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><h1>心電図トレーニング</h1><button class="btn" id="home">ホーム</button></header>
<main id="app"></main>
<script>
{
const FS=250,DUR=15,N=FS*DUR;
const rn=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* ---- 電極位置と双極子モデル ---- */
const SPOT={RSC:[128,98,.6,'右鎖骨下'],LSC:[272,98,.6,'左鎖骨下'],LLA:[282,305,.6,'左下腹部（肋骨弓下）'],MAN:[200,92,.85,'胸骨柄'],CM1:[180,177,.85,'第4肋間 胸骨右縁'],CM2:[220,177,.85,'第4肋間 胸骨左縁'],CM3:[247,191,.75,'V2とV4の中点'],CM4:[274,205,.6,'第5肋間 左鎖骨中線'],CM5:[308,205,.3,'左前腋窩線（V4の高さ）'],CM6:[336,205,0,'左中腋窩線（V4の高さ）'],CM4R:[126,205,.6,'右第5肋間 鎖骨中線（V4R）']};
const P3X={V7:[1.4,.55,-.7],V8:[1.0,.55,-1.2],V9:[.45,.55,-1.35]};
const FAR={RSC:[-.866,-.5,0],LSC:[.866,-.5,0],LLA:[0,1,0]},FC=.5,HC=[.3,.42,0];
const nz=d=>{const m=Math.hypot(d[0],d[1],d[2]);return[d[0]/m,d[1]/m,d[2]/m]};
const neg=d=>[-d[0],-d[1],-d[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function fe(k){if(FAR[k])return FAR[k].map(v=>v*FC);let q;if(P3X[k])q=P3X[k];else{const[a,b,z]=SPOT[k];q=[(a-200)/100,(b-150)/100,z]}const r=[q[0]-HC[0],q[1]-HC[1],q[2]-HC[2]],m=Math.hypot(r[0],r[1],r[2])**3;return r.map(v=>v/m)}
const LV=(p,n)=>{const a=fe(p),b=fe(n);return[a[0]-b[0],a[1]-b[1],a[2]-b[2]]};
const D={P:[.6,.75,.1],Q:[-.6,.3,.75],R:[.5,.65,-.6],S:[-.35,-.6,-.6],T:[.6,.7,.2],ANT:[.35,.1,.93],LAT:[.8,.3,.4],RB:[-.5,.1,.85],LB:[.75,.3,-.6],F:[.1,.8,.5],V:[.2,.9,-.4],V2:[-.4,-.85,.2],INF:[-.35,.94,0],LATH:[.85,-.4,.2],POST:[.3,.15,-.95],RVI:[-.8,.35,.45],ANTR:[-.2,0,1],EXT:[.5,-.2,.85],HL:[.75,-.55,.35],APEX:[.45,.7,.55],LMTI:[-.6,-.75,.1],PC:[.3,-.85,-.3],SP:[.2,1,.4]};
const K=1/dot(LV('LLA','RSC'),nz(D.R));
function sigNew(){return{x:new Float64Array(N),y:new Float64Array(N),z:new Float64Array(N),sp:[],n:new Float64Array(N),qrs:[],ev:[]}}
const EV=(s,k,t,o)=>{s.ev.push(Object.assign({k,t},o||{}));if(k==='V')s.qrs.push(t+.04)};
function G(s,a,mu,s1,s2,d){s2=s2||s1;const v=nz(d).map(c=>c*a*K),i0=Math.max(0,Math.floor((mu-5*s1)*FS)),i1=Math.min(N-1,Math.ceil((mu+5*s2)*FS));for(let i=i0;i<=i1;i++){const q=i/FS-mu,w=q<0?s1:s2,g=Math.exp(-.5*q*q/(w*w));s.x[i]+=v[0]*g;s.y[i]+=v[1]*g;s.z[i]+=v[2]*g}}
function PL(s,a,t1,t2,e,d){const v=nz(d).map(c=>c*a*K),i0=Math.max(0,Math.floor((t1-6*e)*FS)),i1=Math.min(N-1,Math.ceil((t2+6*e)*FS));for(let i=i0;i<=i1;i++){const t=i/FS,g=1/(1+Math.exp(-(t-t1)/e))-1/(1+Math.exp(-(t-t2)/e));s.x[i]+=v[0]*g;s.y[i]+=v[1]*g;s.z[i]+=v[2]*g}}
function AV(s,i,a,d){const v=nz(d);s.x[i]+=v[0]*a*K;s.y[i]+=v[1]*a*K;s.z[i]+=v[2]*a*K}
function beat(s,t,o){o=Object.assign({p:.15,pD:D.P,pr:.16,q:.12,r:1.1,rw:.011,sw:.22,ta:.3,tD:D.T,tc:.26,t1:.05,t2:.035,st:0,stD:D.ANT,u:0},o||{});
 if(o.p){G(s,o.p,t-o.pr+.01,.022,.022,o.pD);EV(s,'A',t-o.pr-.04,{ec:o.pD!==D.P})}
 EV(s,'V',t-.04,{v:'n'});
 G(s,o.q,t-.022,.008,.008,D.Q);G(s,o.r,t,o.rw,o.rw,D.R);G(s,o.sw,t+.024,.009,.009,D.S);
 if(o.st)PL(s,o.st*(s.stK||1),t+.045,t+o.tc-.02,.012,o.stD);
 if(o.ta)G(s,o.ta,t+o.tc,o.t1,o.t2,o.tD);
 if(o.u)G(s,o.u,t+o.tc+.2,.045,.045,o.tD)}
function pvc(s,t,d,w){w=w||1;EV(s,'V',t-.04,{v:'pvc',site:d===D.V?[112,205]:d===D.V2?[188,236]:[226,168]});G(s,1.3,t,.03*w,.045*w,d);G(s,.35,t+.09*w,.03,.03,neg(d));G(s,.5,t+.32,.07,.05,neg(d))}
const P=(s,t)=>{G(s,.15,t,.022,.022,D.P);EV(s,'A',t-.05)};
const seq=(s,arr,o)=>arr.forEach(t=>beat(s,t,o));
function rep(per,fn){for(let o=0;o<DUR+.5;o+=per)fn(o)}
let RRK=1;function reg(start,rr,fn,j){j=j===undefined?.02:j;rr*=RRK;let t=start;while(t<DUR+.4){fn(t);t+=rr*(1+rn(-j,j))}}
function waves(s,list){for(let i=0;i<N;i++){const x=i/FS;list.forEach(w=>AV(s,i,w.a*(w.m?(.7+.3*Math.sin(2*Math.PI*w.m*x+w.p)):1)*Math.sin(2*Math.PI*w.f*x+w.p),w.d))}}

const C=[
{id:'nsr',n:'洞調律',cat:'rate',lead:'II',acc:['II'],sc:'「なんとなく胸が苦しい」と訴える50代。',
 pts:['P波→QRSが1対1で続く','心拍数60〜100/分、RR間隔ほぼ一定','PR間隔0.12〜0.20秒（小さいマス3〜5個）'],
 gen:s=>reg(.35,.83,t=>beat(s,t))},
{id:'stach',n:'洞頻脈',cat:'rate',lead:'II',acc:['II'],sc:'気分不良を訴える30代。',
 pts:['波形は洞調律と同じで、心拍数100/分超','原因（発熱・脱水・疼痛・出血・低酸素など）の評価が大切'],
 gen:s=>reg(.3,.5,t=>beat(s,t,{pr:.14,tc:.21,t1:.04,t2:.03,ta:.28}))},
{id:'sbrady',n:'洞徐脈',cat:'rate',lead:'II',acc:['II'],sc:'ふらつきを訴える70代。',
 pts:['波形は洞調律と同じで、心拍数60/分未満','P波とQRSの関係は正常（1対1・PR一定）'],
 gen:s=>reg(.5,1.4,t=>beat(s,t))},
{id:'sss',sa:1,n:'洞不全症候群',cat:'rate',lead:'II',acc:['II'],sc:'最近ときどき目の前が暗くなるという80代。',
 pts:['P波もQRSも出ない長い休止（洞停止・洞房ブロック）','この波形は洞停止の例','分類：Ⅰ型 洞徐脈／Ⅱ型 洞停止・洞房ブロック／Ⅲ型 徐脈頻脈症候群','長い休止で失神（アダムス・ストークス発作）を起こしうる'],
 gen:s=>rep(7.55,o=>seq(s,[.4,1.25,2.1,5.4,6.25,7.1].map(t=>t+o)))},
{id:'af',af:1,n:'心房細動',cat:'rate',lead:'II',acc:['II','CM1'],sc:'動悸と息切れを訴える70代。',
 pts:['P波がなく、基線が細かく揺れる（f波）','RR間隔が完全に不規則（絶対性不整脈）','心内血栓による脳塞栓のリスク'],pw:'f波はⅡ誘導のほか、右心房に近いCM1（V1相当）でも見やすい。',
 gen:s=>{let t=.3;while(t<DUR+.3){beat(s,t,{p:0});t+=rn(.38,1.05)}waves(s,[{a:.06,f:rn(5,5.6),p:rn(0,6),m:.7,d:D.F},{a:.04,f:rn(6.4,7),p:rn(0,6),d:D.F},{a:.025,f:rn(7.8,8.4),p:rn(0,6),d:[-.3,.6,.7]}])}},
{id:'avb1',n:'1度房室ブロック',cat:'av',lead:'II',acc:['II'],sc:'健診で心電図の異常を指摘された60代。症状なし。',
 pts:['PR間隔が0.20秒（大きいマス1個）を超えて延長','PRは毎拍一定で、QRSの脱落はない'],
 gen:s=>reg(.45,.92,t=>beat(s,t,{pr:.32}),.01)},
{id:'wen',n:'2度房室ブロック（ウェンケバッハ型）',cat:'av',lead:'II',acc:['II'],sc:'ふらつきを訴える60代。',
 pts:['PR間隔が1拍ごとに徐々に延長','やがてP波の後のQRSが脱落し、これを繰り返す','多くは房室結節レベルのブロックで、比較的予後良好'],
 gen:s=>{const pat=[.16,.28,.35,0];for(let k=0;k<43;k++){const pc=.2+k*.72,pr=pat[k%4];if(pr)beat(s,pc+pr-.01,{pr});else P(s,pc)}}},
{id:'mob',n:'2度房室ブロック（モビッツⅡ型）',cat:'av',lead:'II',acc:['II'],sc:'失神して倒れたという70代。',
 pts:['PR間隔は一定のまま、突然QRSが脱落','ヒス束以下のブロックが多く、3度房室ブロックへ移行しやすい','ペーシングの適応になりうる危険な徐脈'],
 gen:s=>{const pat=[.18,.18,0];for(let k=0;k<40;k++){const pc=.2+k*.78,pr=pat[k%3];if(pr)beat(s,pc+pr-.01,{pr});else P(s,pc)}}},
{id:'avb3',avd:1,n:'3度房室ブロック',cat:'av',lead:'II',acc:['II'],sc:'倦怠感と息切れを訴える80代。',
 pts:['P波とQRSが無関係に出現（房室解離）','PP間隔・RR間隔はそれぞれほぼ一定','心室補充調律で高度な徐脈、QRS幅が広いことが多い'],
 gen:s=>{const o=rn(0,.3);for(let t=.15+o;t<DUR+.3;t+=.66)P(s,t);for(let t=.6;t<DUR+.3;t+=1.65){EV(s,'V',t-.05,{v:'pvc',site:[140,238]});G(s,.9,t,.035,.045,D.V);G(s,.3,t+.1,.03,.03,neg(D.V));G(s,.35,t+.36,.08,.06,neg(D.V))}}},
{id:'pace',pl:1,n:'ペーシング波形',cat:'av',lead:'II',acc:['II'],sc:'胸に手術の痕がある80代。気分不良を訴える。',
 pts:['縦に細く鋭いペーシングスパイクの直後に幅広いQRS（心室ペーシング）','スパイクの後にQRSが続くか（キャプチャー）を確認','自己心拍を感知して抑制されているか（センシング）も確認'],
 gen:s=>reg(.4,1.0,t=>{EV(s,'V',t-.03,{v:'pace'});s.sp.push({t:t-.03,a:1.6,d:D.SP});G(s,1.65,t+.02,.035,.045,D.PC);G(s,.6,t+.33,.07,.05,neg(D.PC))},0)},
{id:'pvc',n:'心室期外収縮',cat:'pvc',lead:'II',acc:['II'],sc:'動悸を訴える50代。',
 pts:['予定より早く、先行するP波のない幅広いQRS（0.12秒以上）','T波はQRSと逆向き','後に代償性休止（前後のRRの和が正常RRの2倍）'],
 gen:s=>rep(7.65,o=>{seq(s,[.35,1.2,2.05,2.9,4.6,5.45,6.3,7.15].map(t=>t+o));pvc(s,3.4+o,D.V)})},
{id:'pvcf',n:'多発性心室期外収縮',cat:'pvc',lead:'II',acc:['II'],sc:'動悸と胸の違和感を訴える60代。',
 pts:['同じ形のPVCが頻発（ラウン分類2：1時間に30個以上）','この波形は正常拍とPVCが交互に出る「二段脈」','形が1種類＝発生源が1か所'],
 gen:s=>{for(let t=.35;t<DUR+.3;t+=1.7){beat(s,t);pvc(s,t+.5,D.V)}}},
{id:'pvcm',n:'多源性心室期外収縮',cat:'pvc',lead:'II',acc:['II'],sc:'胸苦しさを訴える70代。',
 pts:['形の異なるPVCが混在（ラウン分類3）','発生源が複数あることを示し、単源性より危険度が高い'],
 gen:s=>rep(7.65,o=>{seq(s,[.35,1.2,2.9,3.75,5.45,6.3].map(t=>t+o));pvc(s,1.7+o,D.V,1);pvc(s,4.25+o,D.V2,1.25);pvc(s,6.8+o,D.LB,.75)})},
{id:'ront',n:'R on T型心室期外収縮',cat:'pvc',lead:'II',acc:['II'],sc:'胸苦しさで搬送中の60代。',
 pts:['PVCが直前の拍のT波の頂上付近に重なる','ラウン分類5（最も危険）','心室頻拍・心室細動の引き金になりうる'],
 gen:s=>rep(7.65,o=>{seq(s,[.35,1.2,2.05,2.9,4.6,5.45,6.3,7.15].map(t=>t+o));pvc(s,3.16+o,D.V)})},
{id:'pac',n:'上室期外収縮',cat:'pvc',lead:'II',acc:['II','CM1'],sc:'動悸を訴える40代。',
 pts:['予定より早く、形の異なるP波が出現','QRSは通常幅が狭く、正常拍と同じ形','後の休止は代償性にならない（非代償性休止）'],pw:'P波の形の違いはⅡ誘導やCM1（V1相当）で見やすい。',

  <div class="fb" style="margin:0 0 8px;background:light-dark(#e8f0fd,#15264a);border:1.5px solid #1d5fd0"><b>今見ている誘導：</b>${hView.lab}<br><b>見ている範囲：</b>${hView.area}${leadFigHTML(hView)}</div>
  <canvas id="mini" style="width:100%;height:104px;display:block;border-radius:8px;margin-bottom:10px" aria-label="ミニ心電図モニター"></canvas>
  <div class="seg" style="margin-bottom:8px">${[['3d','立体'],['2d','平面']].map(m=>`<button data-hm="${m[0]}" class="${hMode===m[0]?'on':''}">${m[1]}</button>`).join('')}${hMode==='3d'?'<button id="front">正面に戻す</button>':''}</div><div class="mut" style="margin:0 0 4px">表示する項目（タップで表示／非表示）</div><div class="seg" style="margin-bottom:8px"><button id="corbtn" class="${hCor?'on':''}" aria-pressed="${hCor}">冠動脈</button><button id="cdbtn" class="${hCond?'on':''}" aria-pressed="${hCond}">刺激伝導系</button><button id="lbbtn" class="${hLab?'on':''}" aria-pressed="${hLab}">文字</button></div>
  <div class="hwrap"><div>${hMode==='3d'?'<canvas id="h3" style="width:100%;height:min(76vw,380px);display:block;touch-action:none;cursor:grab" aria-label="心臓の立体モデル。ドラッグで回転"></canvas>':`<div class="heart ${hCond?'':'nocd'} ${hLab?'':'nolb'}">${heartSVG(c)}</div>`}</div>
  <div class="lsel" role="group" aria-label="誘導の切り替え"><div class="t" style="grid-column:auto">肢</div><div class="t" style="grid-column:auto">胸部</div>${['I','V1','II','V2','III','V3','aVR','V4','aVL','V5','aVF','V6'].map(k=>`<button data-k12="${k}" class="${hKey===k?'on':''}">${kLab(k)}</button>`).join('')}</div></div>
  ${hMode==='3d'?'<div class="sm" style="text-align:center;margin-top:0">心臓は指でドラッグすると回転／右のボタンで誘導を切り替え</div>':'<div class="sm" style="text-align:center;margin-top:0">右のボタンで誘導を切り替え</div>'}
  <div class="leg"><span><span class="dot" style="background:#ffd84a"></span>興奮（脱分極）</span><span><span class="dot" style="background:#ff9f1a"></span>刺激伝導系を伝わる電気</span><span><span class="dot" style="background:#4f86e8"></span>今の誘導が見ている範囲</span><span><span class="dot" style="background:#c8202c"></span>冠動脈（白い点＝血流）</span>${c.zone?'<span><span class="dot" style="background:#c0303a"></span>虚血部位（イメージ）</span>':''}</div>
  <div class="mut" style="margin:8px 0 4px">再生速度</div><div class="seg">${[1,.5,.25].map(k=>`<button data-sp="${k}" class="${hSpeed===k?'on':''}">${k===1?'等速':k+'倍'}</button>`).join('')}</div>
  ${c.cor?`<div class="fb ng" style="margin-top:8px"><b>責任冠動脈：</b>${CORN[c.cor[0]]}${c.cor[1]==='prox'?'の近位部':c.cor[1]==='dist'?'の遠位部':''}が${c.cor[1]==='sten'?'狭くなり（狭窄）、心筋への血流が足りない状態':c.cor[1]==='old'?'閉塞したあとの状態（梗塞後）':'閉塞'}。${c.cor[1]==='sten'?'':'✕より先の血管（灰色の点線）に血液が流れていません。'}</div>`:''}
  <div class="sm">黄色く光る＝電気的な興奮、少し縮む＝収縮。刺激伝導系と冠動脈は心臓を透かして表示しています。模式図なので、実際の形・走行・大きさとは異なります。</div>`};
 app.innerHTML=`<div class="card"><span class="tag">${CATS[c.cat]||'その他の病気（クイズ専用）'}</span><h2 style="font-size:20px;margin:0">${c.n}</h2></div>
  <div class="card"><h2>12誘導</h2>${hrHTML(c,s)}<div class="paper"><canvas id="c12" style="cursor:pointer"></canvas></div><div class="sm">各誘導0〜2.5秒（同じ時間帯）／最下段：Ⅱ誘導0〜10秒。<b>誘導をタップ</b>すると、下の心臓シミュレーションがその誘導に切り替わります（青枠＝選択中）。</div>${ref12HTML()}</div>
  <div class="card" id="hc"></div>
  <div class="card"><h2>特徴</h2>${featHTML(c)}<div class="sm"><b>例：</b>${c.sc}</div><div class="row" style="margin-top:12px"><button class="btn pri" id="bk">図鑑に戻る</button></div></div>`;
 cur=null;
 const c12=document.getElementById('c12'),hc=document.getElementById('hc');
 const paint12=()=>{cur12=s;cur12Sel=hKey;draw12(c12,s,hKey)};
 /* 心臓カードだけを描き直す（ページ全体は作り直さないのでスクロール位置が動かない） */
 const drawHeart=(anchor)=>{const el=anchor&&document.querySelector(anchor),y0=el?el.getBoundingClientRect().top:null;
  hc.innerHTML=hcHTML();
  heartRun(c,s,hc,null,{cv:hc.querySelector('#mini'),pr:proj(s,L12[hKey]),lab:hView.lab,hr:hrOf(c,s)});
  hc.querySelectorAll('[data-k12]').forEach(b=>b.onclick=()=>{hKey=b.dataset.k12;paint12();drawHeart('[data-k12="'+hKey+'"]')});
  hc.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{const now=performance.now(),tt=((now-hT0)/1000*hSpeed)%DUR;hSpeed=+b.dataset.sp;hT0=now-tt*1000/hSpeed;drawHeart('[data-sp="'+b.dataset.sp+'"]')});
  hc.querySelectorAll('[data-hm]').forEach(b=>b.onclick=()=>{hMode=b.dataset.hm;drawHeart('[data-hm="'+hMode+'"]')});
  hc.querySelector('#corbtn').onclick=()=>{hCor=!hCor;drawHeart('#corbtn')};hc.querySelector('#cdbtn').onclick=()=>{hCond=!hCond;drawHeart('#cdbtn')};hc.querySelector('#lbbtn').onclick=()=>{hLab=!hLab;drawHeart('#lbbtn')};
  const fb=hc.querySelector('#front');if(fb)fb.onclick=()=>{hRot.y=0;hRot.x=0;hRot.auto=false};
  if(y0!==null){const el2=document.querySelector(anchor);if(el2)window.scrollBy(0,el2.getBoundingClientRect().top-y0)}};
 paint12();
 c12.onclick=e=>{const g=c12._g12;if(!g)return;const r=c12.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,row=Math.floor(py/g.rh);if(row<0||row>5)return;hKey=(px<g.cw?LIMB:CHEST)[row];paint12();drawHeart('#c12')};
 drawHeart(null);
 app.querySelector('#bk').onclick=lib;
 window.scrollTo(0,0)}
document.getElementById('home').onclick=home;
home();
}
</script></body></html>
